<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>选择位置</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f5f6f8;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #searchBar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 20;
            display: flex;
            align-items: center;
        }

        #searchInput {
            flex: 1;
            height: 42px;
            padding: 0 14px;
            border: none;
            border-radius: 21px;
            outline: none;
            font-size: 14px;
            color: #333;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
            -webkit-appearance: none;
        }

        #searchBtn {
            height: 42px;
            margin-left: 8px;
            padding: 0 18px;
            border: none;
            border-radius: 21px;
            outline: none;
            font-size: 14px;
            color: #fff;
            background: #3F51B5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
        }

        #resultList {
            position: absolute;
            top: 62px;
            left: 10px;
            right: 10px;
            max-height: 45%;
            overflow-y: auto;
            z-index: 19;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
            display: none;
        }

        .result-item {
            padding: 12px 14px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .result-addr {
            margin-top: 3px;
            font-size: 12px;
            color: #999;
        }

        #bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            padding: 12px 14px 16px;
            background: #fff;
            box-shadow: 0 -2px 10px rgba(0, 0, 0, .12);
        }

        #address {
            min-height: 20px;
            font-size: 14px;
            color: #333;
            line-height: 20px;
        }

        #coord {
            margin-top: 3px;
            font-size: 11px;
            color: #999;
        }

        #btnConfirm {
            width: 100%;
            height: 46px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            outline: none;
            font-size: 16px;
            color: #fff;
            background: #3F51B5;
        }

        #btnStop {
            margin-top: 8px;
            text-align: center;
            font-size: 13px;
            color: #e57373;
            display: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            margin-top: -10px;
            z-index: 15;
            text-align: center;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
<div id="map"></div>

<div id="searchBar">
    <input id="searchInput" type="text" placeholder="搜索地点，例如：北京西站"/>
    <button id="searchBtn" type="button">搜索</button>
</div>

<div id="resultList"></div>

<div id="bottom">
    <div id="address">点击地图或搜索地点进行选择</div>
    <div id="coord"></div>
    <button id="btnConfirm" type="button">确定选择</button>
    <div id="btnStop">停止模拟</div>
</div>

<div id="loading">地图加载中…</div>

<script type="text/javascript">
    var AK = "__AK__";
    var INIT_LAT = __LAT__;
    var INIT_LNG = __LNG__;
    var INIT_ADDRESS = "__ADDRESS__";
    var MOCKING = __MOCKING__;

    var map = null;
    var marker = null;
    var geocoder = null;
    var localSearch = null;
    var selectedPoint = null;
    var selectedAddress = INIT_ADDRESS || "";
    var mapReady = false;

    function ui(id) {
        return document.getElementById(id);
    }

    function setAddress(addr, point) {
        if (typeof addr === "string") {
            selectedAddress = addr;
        }
        ui("address").innerText = selectedAddress || "点击地图或搜索地点进行选择";
        if (point) {
            ui("coord").innerText = "纬度 " + point.lat.toFixed(6) + "  经度 " + point.lng.toFixed(6);
        }
    }

    function reverseGeocode(point) {
        if (!geocoder) {
            return;
        }
        geocoder.getLocation(point, function (result) {
            if (result && result.address) {
                setAddress(result.address, point);
            }
        });
    }

    function selectPoint(point, address) {
        selectedPoint = point;
        if (marker) {
            marker.setPosition(point);
        }
        if (map) {
            map.panTo(point);
        }
        if (address) {
            setAddress(address, point);
        } else {
            setAddress("正在获取地址…", point);
            reverseGeocode(point);
        }
    }

    function hideResults() {
        ui("resultList").style.display = "none";
        ui("resultList").innerHTML = "";
    }

    function renderResults() {
        var results = localSearch.getResults();
        var list = ui("resultList");
        var html = "";
        var count = results ? results.getCurrentNumPois() : 0;
        if (count <= 0) {
            list.innerHTML = "<div class='result-item'><div class='result-title'>没有搜索到相关地点</div></div>";
            list.style.display = "block";
            return;
        }
        for (var i = 0; i < count; i++) {
            var poi = results.getPoi(i);
            if (!poi || !poi.point) {
                continue;
            }
            var title = poi.title || "";
            var addr = poi.address || "";
            html += "<div class='result-item' data-index='" + i + "'>" +
                    "<div class='result-title'>" + escapeHtml(title) + "</div>" +
                    "<div class='result-addr'>" + escapeHtml(addr) + "</div></div>";
        }
        list.innerHTML = html;
        list.style.display = "block";
        var items = list.getElementsByClassName("result-item");
        for (var j = 0; j < items.length; j++) {
            items[j].onclick = function () {
                var index = parseInt(this.getAttribute("data-index"), 10);
                var poi = results.getPoi(index);
                if (!poi || !poi.point) {
                    return;
                }
                hideResults();
                map.centerAndZoom(poi.point, 17);
                selectPoint(poi.point, null);
            };
        }
    }

    function escapeHtml(text) {
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function doSearch() {
        var keyword = ui("searchInput").value;
        if (!keyword || keyword.replace(/\s/g, "").length === 0) {
            return;
        }
        if (!localSearch) {
            return;
        }
        hideResults();
        localSearch.search(keyword);
    }

    function initMap() {
        try {
            map = new BMap.Map("map", {enableMapClick: false});
            var center = new BMap.Point(INIT_LNG, INIT_LAT);
            map.centerAndZoom(center, 16);
            map.enableScrollWheelZoom(true);
            map.enableDragging();
            map.enableInertialDragging();

            marker = new BMap.Marker(center);
            marker.enableDragging();
            map.addOverlay(marker);

            geocoder = new BMap.Geocoder();

            localSearch = new BMap.LocalSearch(map, {
                pageCapacity: 10,
                onSearchComplete: renderResults,
                renderOptions: {map: null, autoViewport: false}
            });

            map.addEventListener("click", function (e) {
                selectPoint(e.point, null);
            });

            marker.addEventListener("dragend", function (e) {
                selectPoint(e.point, null);
            });

            ui("searchBtn").onclick = doSearch;
            ui("searchInput").addEventListener("keydown", function (e) {
                if (e.keyCode === 13) {
                    doSearch();
                }
            });

            ui("btnConfirm").onclick = function () {
                if (!selectedPoint) {
                    return;
                }
                Android.onConfirm(selectedPoint.lat, selectedPoint.lng, selectedAddress || "");
            };

            if (MOCKING) {
                ui("btnStop").style.display = "block";
                ui("btnStop").onclick = function () {
                    Android.onStopMock();
                };
            }

            mapReady = true;
            ui("loading").style.display = "none";
            selectPoint(center, INIT_ADDRESS || null);
            Android.onMapReady();
        } catch (e) {
            showError("地图初始化失败：" + e);
        }
    }

    function showError(message) {
        ui("loading").style.display = "none";
        ui("address").innerText = message;
        if (window.Android && Android.onMapError) {
            Android.onMapError(message);
        }
    }

    window.setTimeout(function () {
        if (!mapReady) {
            showError("地图加载失败，请检查网络或百度地图 AK 配置");
        }
    }, 12000);
</script>
<script type="text/javascript"
        src="https://api.map.baidu.com/api?v=3.0&ak=__AK__&callback=initMap"></script>
</body>
</html>
